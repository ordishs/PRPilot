name: PRPilot
options:
  bundleIdPrefix: com.ordishs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PRPilotCore:
    path: Core
targets:
  PRPilot:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: PRPilotCore
        product: PRPilotModels
      - package: PRPilotCore
        product: AppCore
      - package: PRPilotCore
        product: DiffKit
      - package: PRPilotCore
        product: ClaudeSessionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ordishs.PRPilot
        PRODUCT_NAME: "PR Pilot"
        INFOPLIST_KEY_CFBundleDisplayName: "PR Pilot"
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Release:
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "83K7DKZ4B9"
          ENABLE_HARDENED_RUNTIME: YES
schemes:
  PRPilot:
    build:
      targets:
        PRPilot: all
    run:
      config: Debug
